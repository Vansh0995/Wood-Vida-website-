<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WOOD VIDA</title>

    <link
        rel="stylesheet"
        href="loading.css"
    >

    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <div class="loading-screen">

        <!-- Background -->
        <div class="loading-background"></div>

        <!-- Dark Overlay -->
        <div class="loading-overlay"></div>


        <!-- Content -->
        <div class="loading-content">

            
            <img
                src="Assets/logowoodvida.png"
                alt="Wood Vida"
                class="loading-tree-desk"
            >

            <!-- Brand -->
            <div class="loading-brand">
                WOOD VIDA
            </div>

            <!-- Message -->
            <div class="loading-message">
                Thank You For Connecting With Nature.
            </div>

            <!-- Loading Circle -->
            <div class="loading-spinner"></div>

        </div>

    </div>


    <script src="loading.js"></script>

</body>

</html>
